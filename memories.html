<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Memories 🎀</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Comic Sans MS", "Arial Rounded MT Bold", sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background-color: #fff0f7;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  background: white;
  max-width: 480px;
  width: 100%;
  border-radius: 30px;
  padding: 22px;
  text-align: center;
  border: 3px solid #ffb6d5;
  box-shadow: 0 15px 30px rgba(255, 111, 174, 0.25);
}

h1 {
  color: #ff5fa2;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 15px 0;
}

.photo-grid img {
  width: 100%;
  border-radius: 15px;
}

.photo-grid img.big {
  grid-column: span 2;
}

.song-box {
  background: #fff6fb;
  border-radius: 18px;
  padding: 15px;
  margin-top: 15px;
}

button {
  margin-top: 15px;
  padding: 12px 26px;
  border-radius: 999px;
  border: none;
  font-size: 16px;
  background: #ff5fa2;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="card">
  <h1> Random Pics??? </h1>

  <!-- 7 PHOTOS -->
  <div class="photo-grid">
    <img src="1.jpeg">
    <img src="6.jpeg">
    <img src="2.jpeg">
    <img src="3.jpeg">
    <img src="4.jpeg">
    <img src="5.jpeg">
    <img src="7.jpeg" class="big">
  </div>

  <!-- SPOTIFY SONG -->
  <div class="song-box">
    <p> Another song dedicated for you</p>

    <!-- REPLACE SPOTIFY_TRACK_ID --!>
    <iframe
      style="border-radius:12px"
      src="https://open.spotify.com/embed/track/0620OecAlwJQxWieRW4L9s?si=43bbacac185340bf"
      width="100%" height="80"
      frameBorder="0"
      allow="autoplay; clipboard-write; encrypted-media;">
    </iframe>
  </div>

  <button onclick="goNext()">Continue 💖</button>
</div>

<script>
function goNext() {
  window.location.href = "yes.html";
}
</script>

</body>
</html>
